name: Localise Decluttered Bytes images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/localise-decluttered-images.yml']
permissions:
  contents: write
concurrency:
  group: decluttered-image-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download, validate and update imported images
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, urllib.request, urllib.parse, time
          from concurrent.futures import ThreadPoolExecutor
          pattern = re.compile(r'https?://(?:www\.)?declutteredbytes\.blog/wp-content/uploads/(\d{4}/\d{2}/[A-Za-z0-9_.%~-]+\.(?:png|jpe?g|webp|gif|avif))(?:\?[^\s"<>),\]]*)?', re.I)
          posts = {p: p.read_text(encoding='utf-8') for p in pathlib.Path('_posts').glob('*.md')}
          urls = {m.group(0): m.group(1) for s in posts.values() for m in pattern.finditer(s)}
          def valid(data, ext):
              return (ext == '.png' and data.startswith(b'\x89PNG\r\n\x1a\n') or
                      ext in ('.jpg','.jpeg') and data.startswith(b'\xff\xd8\xff') or
                      ext == '.webp' and data[:4] == b'RIFF' and data[8:12] == b'WEBP' or
                      ext == '.gif' and data[:6] in (b'GIF87a', b'GIF89a') or
                      ext == '.avif' and data[4:8] == b'ftyp' and b'avif' in data[:40])
          def download(item):
              url, rel = item
              target = pathlib.Path('assets/images/decluttered-bytes') / rel
              ext = target.suffix.lower()
              if target.exists() and valid(target.read_bytes(), ext):
                  return url, '/' + target.as_posix(), None
              sources = [url, 'https://i0.wp.com/declutteredbytes.blog/wp-content/uploads/' + rel]
              error = None
              for source in sources:
                  try:
                      request = urllib.request.Request(source, headers={'User-Agent':'Mozilla/5.0 (compatible; TheOtherTab image migration)', 'Accept':'image/*'})
                      with urllib.request.urlopen(request, timeout=25) as response:
                          data = response.read(30 * 1024 * 1024 + 1)
                      if len(data) > 30 * 1024 * 1024 or not valid(data, ext):
                          raise ValueError('Unexpected image format or size')
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                      return url, '/' + target.as_posix(), None
                  except Exception as exc:
                      error = str(exc)
              return url, None, error
          with ThreadPoolExecutor(max_workers=4) as pool:
              results = list(pool.map(download, urls.items()))
          mapping = {url: local for url, local, error in results if local}
          failures = [(url, error) for url, local, error in results if not local]
          changed = 0
          for path, source in posts.items():
              updated = pattern.sub(lambda m: mapping.get(m.group(0), m.group(0)), source)
              if updated != source:
                  path.write_text(updated, encoding='utf-8')
                  changed += 1
          for url, error in failures:
              print('FAILED:', url, error)
          print(f'{len(mapping)} of {len(urls)} images localised; {changed} posts updated; {len(failures)} failures.')
          with open('/tmp/decluttered-image-result', 'w') as report:
              report.write(str(len(failures)))
          PY
      - name: Commit verified images and references
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- _posts
          if [ -d assets/images/decluttered-bytes ]; then
            git add -- assets/images/decluttered-bytes
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Store Decluttered Bytes images locally and update article references"
            git push origin HEAD:main
          fi
          if [ "$(cat /tmp/decluttered-image-result)" != "0" ]; then
            echo "::error::Some images could not be fetched; their original references were preserved."
            exit 1
          fi
