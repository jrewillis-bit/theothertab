<script>
const dateFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short',year:'numeric'});
const timeFormat=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function tick(){const now=new Date();document.getElementById('live-date').textContent=dateFormat.format(now);const t=document.getElementById('live-time');t.textContent=timeFormat.format(now);t.dateTime=now.toISOString()}tick();setInterval(tick,1000);
const params=new URLSearchParams(location.search),base={{ site.baseurl | jsonify }},path=location.pathname.replace(/\/$/,'');let active=params.get('category')?.toLowerCase()|| (path===base.replace(/\/$/,'')?'home':path===base+'/about'?'about':{{ page.category | default: '' | downcase | jsonify }});function markTab(value){document.querySelectorAll('[data-tab]').forEach(a=>{if(a.dataset.tab===value){a.classList.add('active');a.setAttribute('aria-current','page')}else{a.classList.remove('active');a.removeAttribute('aria-current')}})}markTab(active);const categorySelect=document.getElementById('cat');if(categorySelect){categorySelect.addEventListener('change',()=>markTab(categorySelect.value.toLowerCase()));document.getElementById('clear')?.addEventListener('click',()=>markTab(''))}
document.getElementById('theme').addEventListener('click',()=>{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',d.dataset.theme)}catch(e){}});
</script></body></html>
