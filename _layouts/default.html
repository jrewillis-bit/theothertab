<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">{% seo %}{% feed_meta %}<link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml"><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"><script>try{let t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script></head>
<body><a class="skip" href="#main">Skip to content</a><header><div class="wrap"><div class="top"><a class="brand" href="{{ '/' | relative_url }}"><span class="logo" aria-hidden="true">▣</span> the other tab<span class="accent">.</span></a><button id="theme" type="button" aria-label="Change colour theme">◐ Theme</button></div><nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}">Home</a>{% assign cats = 'Technology,Minimalism,Gaming,Teaching,Life' | split: ',' %}{% for c in cats %}<a href="{{ '/archive/' | relative_url }}?category={{ c | url_encode }}">{{ c }}</a>{% endfor %}<a href="{{ '/about/' | relative_url }}">About</a><a href="{{ '/archive/' | relative_url }}">Search</a></nav></div></header>
<main id="main" class="wrap">{{ content }}</main><footer class="wrap"><span>© {{ site.time | date: '%Y' }} The Other Tab</span><a href="{{ '/feed.xml' | relative_url }}">RSS feed</a><span>No analytics. No clutter.</span></footer><script>document.getElementById('theme').addEventListener('click',()=>{const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('theme',d.dataset.theme)}catch(e){}});</script></body></html>
