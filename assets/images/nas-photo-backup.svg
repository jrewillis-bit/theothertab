<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" role="img" aria-labelledby="title"><title id="title">Phone photos to home NAS to off-site cloud storage</title><rect width="800" height="330" rx="20" fill="#101c30"/><g font-family="system-ui,sans-serif" text-anchor="middle"><text x="400" y="43" fill="white" font-size="24" font-weight="700">From pocket to home to the cloud</text><g stroke="#82aef0" stroke-width="3" fill="none"><path d="M215 145H310m-10-8 10 8-10 8M485 145H580m-10-8 10 8-10 8"/></g><g fill="#1b304b" stroke="#496787"><rect x="45" y="80" width="170" height="130" rx="12"/><rect x="315" y="80" width="170" height="130" rx="12"/><rect x="585" y="80" width="170" height="130" rx="12"/></g><g fill="none" stroke="#c5dcff" stroke-width="3"><rect x="114" y="96" width="32" height="50" rx="5"/><path d="M126 139h8"/><rect x="369" y="105" width="62" height="42" rx="6"/><path d="M390 105v42m20-42v42"/><path d="M645 146h51a13 13 0 0 0 0-26 21 21 0 0 0-39-8 17 17 0 0 0-12 34Z"/></g><g fill="white" font-size="17" font-weight="700"><text x="130" y="176">Mobile phone</text><text x="400" y="176">Home NAS</text><text x="670" y="176">Backblaze</text></g><g fill="#b8cbe4" font-size="13"><text x="130" y="194">Original photos</text><text x="400" y="194">Local copy</text><text x="670" y="194">Off-site copy</text><text x="400" y="243">Keep versions and test restoring files.</text><text x="400" y="270">Sync alone may replicate accidental deletions.</text><text x="400" y="298">Illustrative workflow</text></g></g></svg>