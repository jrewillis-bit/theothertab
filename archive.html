<section class="page-head"><p class="eyebrow">Explore the other tab</p><h1>Articles.</h1><p class="intro">Find something worth opening another tab for.</p></section><div class="filters"><label for="q">Search articles</label><input id="q" type="search" placeholder="Search titles, topics and descriptions"><label for="cat">Category</label><select id="cat"><option value="">All categories</option>{% assign cats = 'Technology,Minimalism,Gaming,Teaching,Life' | split: ',' %}{% for c in cats %}<option>{{ c }}</option>{% endfor %}</select><button id="clear" type="button">Clear filters</button></div><p id="count" role="status" class="meta"></p>{% include post-list.html posts=site.posts %}<script>const q=document.getElementById('q'),cat=document.getElementById('cat'),params=new URLSearchParams(location.search),entries=[...document.querySelectorAll('.entry')];let tag=params.get('tag')||'';if([...cat.options].some(o=>o.value===params.get('category')))cat.value=params.get('category');function filter(){let n=0;entries.forEach(e=>{let ok=(!cat.value||e.dataset.category===cat.value)&&(!tag||e.dataset.tags.split('|').includes(tag))&&(e.textContent+' '+e.dataset.tags).toLowerCase().includes(q.value.trim().toLowerCase());e.hidden=!ok;if(ok)n++});document.getElementById('count').textContent=n+' article'+(n===1?'':'s')+(tag?' · Tag: '+tag:'')}q.addEventListener('input',filter);cat.addEventListener('change',filter);document.getElementById('clear').onclick=()=>{q.value='';cat.value='';tag='';history.replaceState(null,'',location.pathname);filter()};filter();</script>
