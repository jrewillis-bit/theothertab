<section class="page-head"><p class="eyebrow">Explore the other tab</p><h1>Articles.</h1><p class="intro">Find something worth opening another tab for.</p></section><div class="filters"><label for="q">Search articles</label><input id="q" type="search" placeholder="Search titles, topics and descriptions"><label for="cat">Category</label><select id="cat"><option value="">All categories</option>{% assign cats = 'Technology,Minimalism,Gaming,Teaching,Photography,Life' | split: ',' %}{% for c in cats %}<option>{{ c }}</option>{% endfor %}</select><label for="month">Publication month</label><select id="month"><option value="">All dates</option>{% assign months = site.posts | group_by_exp: 'p', "p.date | date: '%Y-%m'" %}{% for m in months %}<option value="{{ m.name }}">{{ m.items.first.date | date: '%B %Y' }}</option>{% endfor %}</select><button id="random-article" type="button">Random article</button><button id="clear" type="button">Clear filters</button></div><p id="count" role="status" class="meta"></p>{% include post-list.html posts=site.posts %}<script>const q=document.getElementById('q'),cat=document.getElementById('cat'),params=new URLSearchParams(location.search),entries=[...document.querySelectorAll('.entry')];let tag=params.get('tag')||'';if([...cat.options].some(o=>o.value===params.get('category')))cat.value=params.get('category');function filter(){let n=0;entries.forEach(e=>{let ok=(!document.getElementById('month').value||e.dataset.month===document.getElementById('month').value)&&(!cat.value||e.dataset.category===cat.value)&&(!tag||e.dataset.tags.split('|').includes(tag))&&(e.textContent+' '+e.dataset.tags).toLowerCase().includes(q.value.trim().toLowerCase());e.hidden=!ok;if(ok)n++});document.getElementById('count').textContent=n+' article'+(n===1?'':'s')+(tag?' · Tag: '+tag:'')}document.getElementById('month').addEventListener('change',filter);document.getElementById('random-article').onclick=()=>{const available=entries.filter(e=>!e.hidden);if(available.length)location.href=available[Math.floor(Math.random()*available.length)].querySelector('h2 a').href;else document.getElementById('count').textContent='No matching articles to choose from.'};q.addEventListener('input',filter);cat.addEventListener('change',filter);document.getElementById('clear').onclick=()=>{q.value='';cat.value='';document.getElementById('month').value='';tag='';history.replaceState(null,'',location.pathname);filter()};filter();</script>
